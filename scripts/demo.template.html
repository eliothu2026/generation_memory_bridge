<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>代际记忆桥梁 · 纯静态演示</title>
    <style>
      :root {
        --accent: #1a73e8;
        --sidebar: #f0f4f9;
        --ink: #1f1f1f;
        --subtle: #5f6368;
        --line: rgba(0, 0, 0, 0.06);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--sidebar);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      button { font-family: inherit; cursor: pointer; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: #c9ced6; border-radius: 9999px; }
      ::-webkit-scrollbar-track { background: transparent; }

      .app { display: flex; height: 100vh; overflow: hidden; }

      /* ---------- Sidebar ---------- */
      .sidebar { width: 288px; flex: none; background: var(--sidebar); display: flex; flex-direction: column; }
      .sb-head { display: flex; align-items: center; gap: 8px; padding: 16px; }
      .icon-btn { border: none; background: transparent; border-radius: 999px; padding: 8px; color: var(--subtle); line-height: 0; }
      .icon-btn:hover { background: rgba(0, 0, 0, 0.05); }
      .brand { font-size: 15px; font-weight: 600; }
      .sb-pad { padding: 0 12px; }
      .new-btn { display: flex; width: 100%; align-items: center; gap: 8px; border: none; border-radius: 999px; background: #fff; padding: 10px 16px; font-size: 14px; font-weight: 600; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04); }
      .new-btn:hover { box-shadow: 0 1px 2px rgba(60,64,67,.1),0 2px 6px 2px rgba(60,64,67,.06); }
      .plus { color: var(--accent); font-weight: 700; }
      .sb-list { margin-top: 16px; flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px; }
      .grp { padding: 4px 8px; font-size: 12px; font-weight: 500; color: var(--subtle); }
      .card { display: flex; align-items: flex-start; gap: 10px; border-radius: 12px; padding: 10px 12px; margin-bottom: 4px; }
      .card.active { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04); }
      .card .ci { color: var(--subtle); margin-top: 2px; }
      .card.active .ci { color: var(--accent); }
      .card .ct { font-size: 14px; font-weight: 500; }
      .card .cs { font-size: 12px; color: var(--subtle); }
      .sb-note { border-radius: 8px; background: #fffbeb; color: #92651a; font-size: 11px; line-height: 1.6; padding: 8px 12px; margin: 4px 0; }
      .sb-foot { padding: 12px 20px; font-size: 11px; color: var(--subtle); }

      /* ---------- Main ---------- */
      .main { display: flex; flex-direction: column; flex: 1; min-width: 0; }
      .topbar { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); background: #fff; padding: 10px 24px; }
      .tt { font-size: 14px; font-weight: 600; }
      .ts { font-size: 12px; color: var(--subtle); }
      .cfg { display: flex; align-items: center; gap: 4px; border: none; background: transparent; border-radius: 999px; padding: 6px 10px; font-size: 12px; color: var(--subtle); }
      .cfg:hover { background: #f1f3f4; }
      .body { display: flex; flex: 1; min-height: 0; }

      /* ---------- Chat ---------- */
      .chat { display: flex; flex-direction: column; flex: 1; min-width: 0; background: #fff; }
      .chat-scroll { flex: 1; overflow-y: auto; padding: 24px 16px; }
      .chat-inner { max-width: 768px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
      .empty { margin-top: 96px; text-align: center; color: var(--subtle); }
      .empty .tree { font-size: 48px; }
      .empty-title { margin: 16px 0 0; font-size: 18px; font-weight: 500; color: var(--ink); }
      .empty-sub { margin: 4px 0 0; font-size: 14px; }
      .empty-hint { margin: 24px 0 0; font-size: 14px; }

      .row { display: flex; gap: 12px; }
      .row.gc { justify-content: flex-end; }
      .avatar { width: 36px; height: 36px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
      .avatar.amber { background: #fef3c7; }
      .avatar.blue { background: #dbeafe; }
      .col { min-width: 0; flex: 1; }
      .gc-col { flex: 0 1 auto; max-width: 80%; }
      .name { margin-bottom: 4px; font-size: 12px; font-weight: 500; color: var(--subtle); }
      .gc-name { text-align: right; }
      .bubble { display: inline-block; max-width: 100%; padding: 12px 16px; font-size: 15px; line-height: 1.7; }
      .elder-bubble { background: #f1f3f4; color: var(--ink); border-radius: 16px; border-top-left-radius: 6px; }
      .gc-bubble { background: linear-gradient(135deg, #1a73e8, #4f46e5); color: #fff; border-radius: 16px; border-top-right-radius: 6px; }

      .note { margin-top: 8px; border: 1px solid #e0e7ff; background: rgba(238, 242, 255, 0.6); border-radius: 12px; padding: 10px 14px; animation: fade 0.3s ease-out both; }
      .note-head { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #4338ca; margin-bottom: 4px; }
      .note-tag { margin-left: auto; font-size: 10px; font-weight: 400; color: #a5b4fc; }
      .note-body { font-size: 14px; line-height: 1.6; color: #334155; }

      .chips { margin-top: 10px; animation: fade 0.3s ease-out both; }
      .chips-head { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: #b45309; margin-bottom: 6px; }
      .chips-hint { font-size: 10px; font-weight: 400; color: var(--subtle); }
      .chips-row { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip { border: 1px solid #fde68a; background: #fffbeb; color: #78350f; border-radius: 999px; padding: 6px 12px; font-size: 13px; text-align: left; }
      .chip:hover { border-color: #fcd34d; background: #fef3c7; }

      .composer { border-top: 1px solid var(--line); background: #fff; padding: 12px 16px; }
      .composer-inner { max-width: 768px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
      .input-pill { display: flex; flex: 1; align-items: center; gap: 8px; border: 1px solid rgba(0,0,0,.1); background: #fff; border-radius: 999px; padding: 8px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04); }
      .input-pill:focus-within { border-color: rgba(26,115,232,.4); }
      .input-pill input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 15px; color: var(--ink); }
      .send { border: none; background: transparent; color: var(--accent); border-radius: 999px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
      .send:disabled { color: #cbd5e1; }
      .send:not(:disabled):hover { background: rgba(26,115,232,.1); }
      .next-btn { flex: none; border: none; border-radius: 999px; background: var(--accent); color: #fff; padding: 10px 16px; font-size: 14px; font-weight: 500; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
      .next-btn:hover:not(:disabled) { background: #1765cc; }
      .next-btn:disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }

      /* ---------- Timeline ---------- */
      .timeline { width: 340px; flex: none; border-left: 1px solid var(--line); background: #fff; display: flex; flex-direction: column; }
      .timeline.collapsed { width: 48px; align-items: center; padding-top: 16px; gap: 12px; cursor: pointer; }
      .timeline.collapsed .tl-full { display: none; }
      .tl-mini { display: none; flex-direction: column; align-items: center; gap: 12px; color: var(--subtle); }
      .timeline.collapsed .tl-mini { display: flex; }
      .tl-vert { writing-mode: vertical-rl; font-size: 12px; margin-top: 4px; }
      .tl-full { display: flex; flex-direction: column; min-height: 0; flex: 1; }
      .tl-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
      .tl-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
      .tl-chev { border: none; background: transparent; color: var(--subtle); border-radius: 999px; padding: 4px; }
      .tl-chev:hover { background: #f1f3f4; }
      .era { display: block; margin: 0 16px 8px; border-radius: 8px; background: rgba(26,115,232,.05); color: var(--accent); font-size: 12px; line-height: 1.5; padding: 8px 12px; }
      .era-b { font-weight: 500; }
      .tl-meta { display: flex; align-items: center; gap: 8px; padding: 0 16px 8px; font-size: 11px; color: var(--subtle); }
      .mode { background: #f1f3f4; border-radius: 999px; padding: 2px 8px; }
      .tl-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 16px; }
      .tl-empty { margin-top: 40px; text-align: center; font-size: 14px; line-height: 1.6; color: var(--subtle); }
      .ev { position: relative; padding-left: 32px; padding-bottom: 16px; animation: fadeUp 0.35s ease-out both; }
      .ev-badge { position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 999px; background: rgba(26,115,232,.1); color: var(--accent); font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
      .ev::before { content: ""; position: absolute; left: 11px; top: 24px; width: 1px; height: calc(100% - 24px); background: var(--line); }
      .period { display: inline-block; margin-bottom: 4px; border-radius: 999px; background: #f1f3f4; color: var(--subtle); font-size: 11px; font-weight: 500; padding: 2px 8px; }
      .ev-desc { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--ink); }
      .threads { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
      .threads-head { font-size: 12px; font-weight: 600; color: var(--subtle); margin-bottom: 8px; }
      .thread { border-radius: 8px; background: #fffbeb; color: #78350f; font-size: 12px; line-height: 1.6; padding: 8px 12px; margin-bottom: 6px; }

      .badge-static { display: inline-block; margin-left: 8px; border-radius: 999px; background: #eef2ff; color: #4338ca; font-size: 10px; padding: 2px 8px; vertical-align: middle; }

      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .fade { animation: fadeUp 0.35s cubic-bezier(0.2,0,0,1) both; }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sb-head">
          <div class="brand">代际记忆桥梁 <span class="badge-static">静态演示</span></div>
        </div>
        <div class="sb-pad">
          <button class="new-btn" onclick="reset()"><span class="plus">＋</span> 新建会话</button>
        </div>
        <div class="sb-list">
          <div class="grp">示例</div>
          <div class="card active">
            <span class="ci">✨</span>
            <div><div class="ct" id="sb-title">大槐树的故事</div><div class="cs">离线回放 · 免 key</div></div>
          </div>
          <div class="grp" style="margin-top:16px">我的会话</div>
          <div class="sb-note">这是纯静态预览(离线流程)。真实多会话管理、语音、真实分析请用完整项目(见 README)。</div>
        </div>
        <div class="sb-foot">纯静态演示 · 0 依赖 · 双击即开</div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div>
            <div class="tt" id="top-title">大槐树的故事</div>
            <div class="ts">祖孙对话 · 实时理解(纯静态预览)</div>
          </div>
          <button class="cfg" onclick="alert('完整项目中可在此热配置模型 API Key(DeepSeek)。此为纯静态演示,无需任何配置。')">⚙ 配置</button>
        </header>
        <div class="body">
          <section class="chat">
            <div class="chat-scroll"><div class="chat-inner" id="messages"></div></div>
            <div class="composer">
              <div class="composer-inner">
                <div class="input-pill">
                  <input id="gc-input" placeholder="替孙辈说点什么…(回车发送)" />
                  <button class="send" id="send-btn" title="发送" onclick="sendGC()">➤</button>
                </div>
                <button class="next-btn" id="next-btn" onclick="next()">老人继续讲 ▶</button>
              </div>
            </div>
          </section>

          <aside class="timeline" id="timeline">
            <div class="tl-mini" onclick="toggleTimeline()"><span>◀</span><span>🕓</span><span class="tl-vert">时间线</span></div>
            <div class="tl-full">
              <div class="tl-head">
                <div class="tl-title">🕓 时间线 · 逻辑梳理</div>
                <button class="tl-chev" title="收起" onclick="toggleTimeline()">▶</button>
              </div>
              <div id="tl-era"></div>
              <div class="tl-meta" id="tl-meta"></div>
              <div class="tl-body" id="tl-body"></div>
            </div>
          </aside>
        </div>
      </div>
    </div>

    <script id="demo-data" type="application/json">__DEMO_DATA__</script>
    <script>
      var DATA = JSON.parse(document.getElementById('demo-data').textContent);
      var steps = DATA.steps || [];
      var session = DATA.session || { title: '演示', elder_name: '老人' };
      var MODE_LABEL = { incremental: '增量更新', refine: '轻整理', full_rerun: '全量重跑' };
      var cursor = 0, messages = [], msgId = 0, timelineCollapsed = false;

      document.getElementById('sb-title').textContent = session.title || '演示';
      document.getElementById('top-title').textContent = session.title || '演示';

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
      }
      function currentStep() { return cursor > 0 ? steps[cursor - 1] : null; }
      function scrollBottom() {
        var s = document.querySelector('.chat-scroll');
        s.scrollTop = s.scrollHeight;
      }

      function elderHTML(m) {
        var notes = (m.backgroundNotes || []).map(function (n) {
          return '<div class="note"><div class="note-head">📚 AI 背景补充 <span class="note-tag">AI 推测/补充,非老人原话</span></div><div class="note-body">' + esc(n) + '</div></div>';
        }).join('');
        var chips = (m.followUps && m.followUps.length)
          ? '<div class="chips"><div class="chips-head">💡 你可以这样接 <span class="chips-hint">· 点击填入输入框</span></div><div class="chips-row">' +
            m.followUps.map(function (q) { return '<button class="chip" data-fu="' + esc(q) + '">' + esc(q) + '</button>'; }).join('') +
            '</div></div>'
          : '';
        return '<div class="row elder fade"><div class="avatar amber">👵</div><div class="col"><div class="name">' +
          esc(session.elder_name || '老人') + '</div><div class="bubble elder-bubble">' + esc(m.text) + '</div>' + notes + chips + '</div></div>';
      }
      function grandchildHTML(m) {
        return '<div class="row gc fade"><div class="col gc-col"><div class="name gc-name">我(孙辈)</div><div class="bubble gc-bubble">' +
          esc(m.text) + '</div></div><div class="avatar blue">🧑</div></div>';
      }

      function renderMessages() {
        var el = document.getElementById('messages');
        if (messages.length === 0) {
          el.innerHTML = '<div class="empty"><div class="tree">🌳</div><p class="empty-title">' + esc(session.title) +
            '</p><p class="empty-sub">' + esc(session.subtitle || '') + '</p><p class="empty-hint">点击下方「老人继续讲 ▶」,开始逐段聆听与整理。</p></div>';
          return;
        }
        el.innerHTML = messages.map(function (m) { return m.speaker === 'elder' ? elderHTML(m) : grandchildHTML(m); }).join('');
        el.querySelectorAll('[data-fu]').forEach(function (b) {
          b.onclick = function () {
            var inp = document.getElementById('gc-input');
            inp.value = b.getAttribute('data-fu');
            inp.focus();
            syncSend();
          };
        });
        scrollBottom();
      }

      function renderTimeline() {
        var step = currentStep();
        var tl = step ? step.timeline : { events: [], open_threads: [], last_update_mode: null };
        var era = step ? step.era_estimate : null;
        document.getElementById('tl-era').innerHTML = era
          ? '<span class="era">✨ <span class="era-b">AI 推测年代:</span>' + esc(era) + '</span>' : '';
        document.getElementById('tl-meta').innerHTML = '已听 ' + cursor + '/' + steps.length + ' 段' +
          (tl && tl.last_update_mode ? ' <span class="mode">' + (MODE_LABEL[tl.last_update_mode] || tl.last_update_mode) + '</span>' : '');
        var events = ((tl && tl.events) || []).slice().sort(function (a, b) { return a.order - b.order; });
        var evHTML = events.length
          ? events.map(function (e) {
              return '<div class="ev">' + '<div class="ev-badge">' + esc(e.order) + '</div>' +
                (e.period_hint ? '<span class="period">' + esc(e.period_hint) + '</span>' : '') +
                '<p class="ev-desc">' + esc(e.description) + '</p></div>';
            }).join('')
          : '<p class="tl-empty">老人开始讲述后,<br>这里会实时长出时间线…</p>';
        var threads = (tl && tl.open_threads && tl.open_threads.length)
          ? '<div class="threads"><div class="threads-head">待澄清线索</div>' +
            tl.open_threads.map(function (t) { return '<div class="thread">' + esc(t) + '</div>'; }).join('') + '</div>'
          : '';
        document.getElementById('tl-body').innerHTML = evHTML + threads;
      }

      function updateNextBtn() {
        var b = document.getElementById('next-btn');
        if (cursor >= steps.length) { b.disabled = true; b.textContent = '讲完了'; }
        else { b.disabled = false; b.textContent = '老人继续讲 ▶'; }
      }
      function syncSend() {
        document.getElementById('send-btn').disabled = !document.getElementById('gc-input').value.trim();
      }

      function next() {
        if (cursor < steps.length) {
          var s = steps[cursor];
          messages.push({ id: ++msgId, speaker: 'elder', text: s.elder_text, backgroundNotes: s.new_background_notes || [], followUps: s.follow_ups || [] });
          cursor++;
          renderMessages(); renderTimeline(); updateNextBtn();
        }
      }
      function sendGC() {
        var inp = document.getElementById('gc-input');
        var t = inp.value.trim();
        if (!t) return;
        messages.push({ id: ++msgId, speaker: 'grandchild', text: t });
        inp.value = '';
        syncSend();
        renderMessages();
      }
      function reset() {
        cursor = 0; messages = []; msgId = 0;
        renderMessages(); renderTimeline(); updateNextBtn();
      }
      function toggleTimeline() {
        timelineCollapsed = !timelineCollapsed;
        document.getElementById('timeline').classList.toggle('collapsed', timelineCollapsed);
      }

      var input = document.getElementById('gc-input');
      input.addEventListener('input', syncSend);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendGC(); }
      });

      renderMessages(); renderTimeline(); updateNextBtn(); syncSend();
    </script>
  </body>
</html>
